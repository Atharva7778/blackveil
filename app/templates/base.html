<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKVEIL // {% block title %}TERMINAL{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            padding: 2rem;
        }
        a { color: #00ff41; }
        .header {
            border-bottom: 1px solid #00ff41;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .header h1 { font-size: 1.4rem; letter-spacing: 2px; }
        .sub { color: #666; font-size: 0.85rem; margin-top: 0.4rem; }
        .panel {
            border: 1px solid #333;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            max-width: 520px;
        }
        .panel h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            color: #ffaa00;
        }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #888; }
        input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #00ff41;
            padding: 0.6rem;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        input:focus { outline: none; border-color: #00ff41; }
        button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 0.7rem 1.4rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }
        button:hover { background: #00cc33; }
        .flash { padding: 0.7rem; margin-bottom: 1rem; border-left: 3px solid; font-size: 0.9rem; }
        .flash.error { border-color: #ff3333; color: #ff6666; }
        .flash.success { border-color: #00ff41; color: #00ff41; }
        .stat { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #222; }
        .stat span:first-child { color: #888; }
        .rank { color: #ffaa00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>BLACKVEIL // AGENT TERMINAL</h1>
        <div class="sub">Trust Nobody. Question Everything.</div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
